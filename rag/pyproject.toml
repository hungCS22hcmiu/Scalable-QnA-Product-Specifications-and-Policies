[project]
name = "thesis-rag"
version = "0.1.0"
description = "RAG service (infrastructure) for the scalable QA platform — see docs/Final_Proposal.md §6.1"
requires-python = ">=3.11"

# NOTE: no torch, no sentence-transformers, no transformers.
# Embeddings are served by Ollama (ADR-017): a sentence-transformers stack costs ~2 GB
# resident for a ~400 MB model, and in a 16 GB envelope that is roughly one concurrent
# generation slot. Adding an ML runtime here needs an ADR (.docs/ai/rules.md #7, #9).
dependencies = [
    "llama-index-core>=0.11",
    "llama-index-vector-stores-redis>=0.3",
    "redis>=5.0",
    "grpcio>=1.66",
    "protobuf>=5.27",
    "httpx>=0.27",          # Ollama HTTP API (generation + embeddings)
    "pyyaml>=6.0",          # run manifests (experiment-protocol.md §2)
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.66", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
