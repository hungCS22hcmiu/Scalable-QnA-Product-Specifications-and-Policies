// Go<->Python seam. THE single definition — both sides generate from this file.
//
// Frozen: docs/interfaces.md §B (v0.8). Any change to a wire shape requires an ADR in
// docs/decisions.md and a version bump in interfaces.md. Never hand-edit generated stubs
// on either side (.docs/ai/rules.md #4).
//
// Two RPCs, deliberately: the C1 cascade must obtain source overlap WITHOUT paying for
// generation — "the retriever doubles as a reuse-safety oracle" (ADR-007). A single
// Answer RPC would force a generation to get the overlap, destroying the cascade.

syntax = "proto3";

package rag.v1;

option go_package = "github.com/hung/thesis/gateway/internal/ragpb;ragpb";

service RagService {
  // Full miss path: retrieve + generate. Streaming is optional and out of scope (ADR-016).
  rpc Answer(AnswerRequest) returns (stream AnswerChunk);

  // Retrieval only — supplies the chunk IDs the source-overlap rule compares against.
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
}

message RetrieveRequest {
  string query = 1;
  uint32 top_k = 2;                    // pinned per run and reported (ADR-014)

  // Optional; post-filters the normal unscoped ranking to drop other products' chunks and
  // ensure this product's own chunk is present (ADR-034, interfaces.md §B v0.8) -- never a
  // pre-filter, which regressed by starving PolicyFraction of real signal. Empty preserves
  // today's unscoped search exactly.
  string product_id = 3;
}

message RetrieveResponse {
  repeated string chunk_ids     = 1;   // stable chunk IDs, ranked (interfaces.md §C)
  repeated float  scores        = 2;   // aligned with chunk_ids; retriever similarity
  uint64          dataset_epoch = 3;   // corpus version these chunks came from (§E)

  // Chunk text, POSITIONALLY ALIGNED with chunk_ids: texts[i] is the text of chunk_ids[i],
  // or the field is absent entirely -- never partially populated (ADR-037, interfaces.md §B
  // v0.9). The answer-evidence support gate (ADR-035) compares a cached answer against this
  // text; the gateway holds only identifiers and scores, so the gate cannot run without it.
  //
  // Alignment is an invariant, not a convention. An array shifted by one scores a cached
  // answer against the wrong chunk and returns a support verdict that is wrong with no error
  // raised anywhere. It joins the three obligations AnswerRequest.retrieved_chunk_ids already
  // carries: return the ids you were given, preserve rank order, drop a missing id rather
  // than substitute one.
  repeated string texts         = 4;
}

message AnswerRequest {
  string query  = 1;
  uint32 top_k  = 2;
  bool   stream = 3;                   // defaults false in scope (SSE dropped — ADR-016)

  // Chunk IDs the CALLER already retrieved for this query (ADR-033, interfaces.md §B v0.7).
  //
  // When non-empty the service SKIPS its own retrieval and grounds generation on exactly these
  // chunks. Every Tier-1 miss already retrieves once — in the cascade above tau, inside Answer
  // below it — so without this a banded miss retrieves TWICE, and the second retrieval re-embeds
  // the query, which is the expensive half.
  //
  // ⚠️ The service must return these same ids in source_chunk_ids. Provenance is the reuse rule's
  // input and the dependency map's key, so an entry written under a set that differs from the one
  // the answer was generated over corrupts both contributions with no error (rules.md #6).
  repeated string retrieved_chunk_ids = 4;

  // Optional; scopes Answer's OWN fallback retrieval (used when retrieved_chunk_ids is empty)
  // the same way RetrieveRequest.product_id does (ADR-034, interfaces.md §B v0.8).
  string product_id = 5;
}

message AnswerChunk {
  string text = 1;                        // token / span when streaming
  bool   done = 2;                        // true on the terminal chunk
  repeated string source_chunk_ids = 3;   // terminal chunk; provenance for C1 + C2
  string model_used    = 4;               // terminal chunk; constant (routing rejected, ADR-011)
  uint64 dataset_epoch = 5;               // epoch at retrieval; gates write-back (§E)
}
